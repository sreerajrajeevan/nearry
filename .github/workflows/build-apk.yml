name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate app icons
        run: pip install pillow && python3 assets/generate_icons.py

      - name: Ensure Android SDK 35
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Prebuild Android native project
        run: npx expo prebuild --platform android --non-interactive --no-install

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a --no-daemon
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID || secrets.EXPO_PUBLIC_EAS_PROJECT_ID }}
          EXPO_PUBLIC_LEGAL_OWNER: ${{ vars.EXPO_PUBLIC_LEGAL_OWNER || secrets.EXPO_PUBLIC_LEGAL_OWNER }}
          EXPO_PUBLIC_SUPPORT_EMAIL: ${{ vars.EXPO_PUBLIC_SUPPORT_EMAIL || secrets.EXPO_PUBLIC_SUPPORT_EMAIL }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nearry-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Publish APK to rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: "Nearry debug APK (latest)"
          body: "Latest debug build from main. Grab app-debug.apk below — this link never changes."
          files: android/app/build/outputs/apk/debug/app-debug.apk
