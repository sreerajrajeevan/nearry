name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate app icons
        run: pip install pillow && python3 assets/generate_icons.py

      - name: Ensure Android SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-36" "build-tools;36.0.0" > /dev/null

      # Android push needs Firebase's google-services.json. Paste its contents
      # into the repository secret GOOGLE_SERVICES_JSON; without it the APK
      # still builds, but phones cannot receive notifications.
      - name: Add Firebase config for push notifications
        env:
          GOOGLE_SERVICES_JSON_CONTENT: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_CONTENT" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_CONTENT" > "$RUNNER_TEMP/google-services.json"
            node -e "const c=require(process.argv[1]); if(!c.client?.some(x=>x.client_info?.android_client_info?.package_name==='com.nearry.app')) { console.error('google-services.json is not for com.nearry.app'); process.exit(1) }" "$RUNNER_TEMP/google-services.json"
            echo "GOOGLE_SERVICES_JSON=$RUNNER_TEMP/google-services.json" >> "$GITHUB_ENV"
            echo "Firebase config added: push notifications enabled in this build."
          else
            echo "::warning::GOOGLE_SERVICES_JSON secret is not set, so this APK cannot receive push notifications."
          fi

      - name: Prebuild Android native project
        run: CI=1 npx expo prebuild --platform android --no-install

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a --no-daemon
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID || secrets.EXPO_PUBLIC_EAS_PROJECT_ID }}
          EXPO_PUBLIC_LEGAL_OWNER: ${{ vars.EXPO_PUBLIC_LEGAL_OWNER || secrets.EXPO_PUBLIC_LEGAL_OWNER }}
          EXPO_PUBLIC_SUPPORT_EMAIL: ${{ vars.EXPO_PUBLIC_SUPPORT_EMAIL || secrets.EXPO_PUBLIC_SUPPORT_EMAIL }}
          # Hosted open.html (from npm run legal:export); shared plans link there.
          EXPO_PUBLIC_SHARE_URL: ${{ vars.EXPO_PUBLIC_SHARE_URL || 'https://sreerajrajeevan.github.io/nearry/open.html' }}
          # Crash reporting: on when the DSN variable is set (docs/crash-reporting.md).
          EXPO_PUBLIC_SENTRY_DSN: ${{ vars.EXPO_PUBLIC_SENTRY_DSN }}
          EXPO_PUBLIC_SENTRY_ENVIRONMENT: debug-apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nearry-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Publish APK to rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: "Nearry debug APK (latest)"
          body: "Latest debug build from main. Grab app-debug.apk below — this link never changes."
          files: android/app/build/outputs/apk/debug/app-debug.apk
