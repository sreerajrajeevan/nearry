name: Core checks
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: nearry_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run sql:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:database
        env:
          TEST_DATABASE_URL: postgres://postgres:test-only@localhost:5432/nearry_test
      - run: python3 -m pip install pillow && python3 assets/generate_icons.py
      - run: EXPO_NO_TELEMETRY=1 EXPO_NO_CACHE=1 npx expo export --platform android --platform web
